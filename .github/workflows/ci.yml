
name: Water Infrastructure Intelligence CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  backend-tests:
    name: Backend API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-api.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-api.txt

      - name: Install testing dependencies
        run: |
          python -m pip install pytest==9.2.0 httpx==0.28.1

      - name: Run API tests
        run: |
          python -m pytest tests/test_api.py -v

  frontend-check:
    name: Frontend Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: frontend/requirements.txt

      - name: Install frontend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r frontend/requirements.txt

      - name: Check Python syntax
        run: |
          python -m compileall -q frontend
